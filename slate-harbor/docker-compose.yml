services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data   # named volume = data survives container restarts (durability)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      PORT: "8080"
      # Not read yet — wired in now so it's ready for Step 3.
      DATABASE_URL: "postgres://wallet:wallet@db:5432/wallet?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: